<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt vs Alert vs Confirm</title>
</head>
<body>
  <h2>Prompt, Alert, and Confirm Example</h2>
  <button onclick="showDialogs()">Try It</button>

  <script>
    function showDialogs() {
      // 🔹 1. alert() - simple popup message
      alert("Welcome! This is an alert box.");

      // 🔹 2. prompt() - asks for user input
      let name = prompt("What is your name?", "Guest");
      alert("You entered: " + name);

      // 🔹 3. confirm() - asks for Yes/No (OK/Cancel)
      let isSure = confirm("Do you want to continue?");
      
      if (isSure) {
        alert("You clicked OK. Continuing...");
      } else {
        alert("You clicked Cancel. Stopping...");
      }

      // 🔹 Also log results to console
      console.log("Name entered:", name);
      console.log("Confirm result:", isSure);
    }
  </script>
</body>
</html>
